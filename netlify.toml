# Netlify settings for the Samuniverse site (plain HTML/CSS/JS, no build step)
[build]
  publish = "."
  command = ""

# Cache images and fonts for a year; HTML always fresh
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
